[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devassist"
version = "1.0.0"
description = "AI code review agent for GitHub pull requests (LLM tool use, RAG, MCP, CI/CD)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["anthropic>=0.40", "pydantic>=2.5", "requests>=2.31", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
devassist = "devassist.main:main"
devassist-mcp = "devassist.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devassist = ["web/*.html", "guidelines/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
extend-exclude = ["evals/dataset.py"]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP045", "UP037"]
